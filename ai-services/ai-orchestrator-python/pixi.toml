[workspace]
name = "ai-orchestrator"
version = "0.1.0"
description = "Mojo-first agent orchestrator"
authors = ["GabrielBRS"]
channels = ["https://conda.modular.com/max/", "conda-forge"]
platforms = ["linux-64"]

[dependencies]
mojo = ">=1.0.0,<2"

[tasks]
test = "mojo run -I src tests/mojo/test_core.mojo && mojo run -I src tests/mojo/test_graph.mojo && mojo run -I src tests/mojo/test_agent.mojo && mojo run -I src tests/mojo/test_compute.mojo && mojo run -I src tests/mojo/test_ipc.mojo"
run = "mojo run -I src src/main.mojo"
build = { cmd = "mkdir -p build && mojo build -I src src/main.mojo -o build/agentd" }
format = "mojo format src tests/mojo"
version = "mojo --version"
