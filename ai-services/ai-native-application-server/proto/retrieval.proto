syntax = "proto3";

package ai.orchestrator.v1;

import "common.proto";

// Internal agentic retrieval capability owned by Mojo. Traditional backend
// data access remains in Rust; public clients never address retrieval directly.
service Retrieval {
  rpc Health(HealthRequest) returns (HealthResponse);
  rpc Retrieve(RetrieveRequest) returns (RetrieveResponse);
}

message RetrieveRequest {
  string query = 1;
  int32 top_k = 2;
}

message RetrieveResponse {
  Status status = 1;
  repeated string texts = 2;
}
