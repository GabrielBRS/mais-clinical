syntax = "proto3";

package ai.orchestrator.v1;

import "common.proto";

// Internal retrieval implemented by ai_orchestrator and hosted by Mojo.
// Traditional data access remains in Rust; clients never address this directly.
service Retrieval {
  rpc Health(HealthRequest) returns (HealthResponse);
  rpc Retrieve(RetrieveRequest) returns (RetrieveResponse);
}

message RetrieveRequest {
  string query = 1;
  int32 top_k = 2;
}

message RetrieveResponse {
  Status status = 1;
  repeated string texts = 2;
}
