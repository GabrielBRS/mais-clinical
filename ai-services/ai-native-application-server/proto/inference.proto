syntax = "proto3";

package ai.orchestrator.v1;

import "common.proto";

// Internal Mojo capability. The Rust Application Server is the only caller;
// public clients never address inference directly.
service Inference {
  rpc Health(HealthRequest) returns (HealthResponse);
  rpc Generate(GenerateRequest) returns (GenerateResponse);
}

message GenerateRequest {
  string model_id = 1;
  string prompt = 2;
}

message GenerateResponse {
  Status status = 1;
  string text = 2;
}
