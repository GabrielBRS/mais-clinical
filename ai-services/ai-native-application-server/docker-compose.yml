services:
  ai-agent-runtime:
    build:
      context: .
      dockerfile: ai-agent-runtime/Dockerfile
    image: orzyon/ai-agent-runtime:0.1.0
    environment:
      AOR_AGENT_HTTP_HOST: 0.0.0.0
      AOR_AGENT_HTTP_PORT: 8090
      AOR_CONTRACT_ROOT: /app/ai-agent-contract
      MOJO_PYTHON: /app/ai-agent-runtime/.pixi/envs/default/bin/python
      MOJO_PYTHON_LIBRARY: /app/ai-agent-runtime/.pixi/envs/default/lib/libpython3.13.so
    expose:
      - "8090"
    networks:
      - ai-native-internal
    restart: unless-stopped

  runtime:
    build:
      context: .
      dockerfile: Dockerfile
    image: orzyon/ai-native-runtime:0.1.0
    depends_on:
      - ai-agent-runtime
    environment:
      AOR_HTTP_HOST: 0.0.0.0
      AOR_HTTP_PORT: 8080
      AOR_AGENT_RUNTIME_URL: http://ai-agent-runtime:8090
    ports:
      - "8080:8080"
    networks:
      - ai-native-internal
    restart: unless-stopped

networks:
  ai-native-internal:
    driver: bridge
