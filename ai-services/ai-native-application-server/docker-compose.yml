services:
  mojo-agent-runtime:
    build:
      context: .
      dockerfile: Dockerfile
    image: orzyon/ai-native-agent-runtime:0.1.0
    environment:
      AOR_AGENT_HTTP_HOST: 0.0.0.0
      AOR_AGENT_HTTP_PORT: 8090
    expose:
      - "8090"
    networks:
      - ai-native-internal
    restart: unless-stopped

  runtime:
    build:
      context: .
      dockerfile: runtime-rust/Dockerfile
    image: orzyon/ai-native-runtime:0.1.0
    depends_on:
      - mojo-agent-runtime
    environment:
      AOR_HTTP_HOST: 0.0.0.0
      AOR_HTTP_PORT: 8080
      AOR_MOJO_RUNTIME_URL: http://mojo-agent-runtime:8090
    ports:
      - "8080:8080"
    networks:
      - ai-native-internal
    restart: unless-stopped

networks:
  ai-native-internal:
    driver: bridge
