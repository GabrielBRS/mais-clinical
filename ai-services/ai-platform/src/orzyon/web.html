<!doctype html>
<html lang="pt-BR"><meta charset="utf-8"><meta name="viewport" content="width=device-width">
<title>Orzyon AI Platform</title>
<style>body{font:18px system-ui;background:#0e1725;color:#e9eff7;max-width:820px;margin:8vh auto;padding:24px}h1{font-size:40px}label{display:block;margin:24px 0 8px}input,textarea,button{font:inherit;border-radius:8px;padding:12px;box-sizing:border-box}input,textarea{width:100%;background:#172638;color:white;border:1px solid #567}button{margin:16px 8px 8px 0;background:#87e4c3;border:0;cursor:pointer}pre{white-space:pre-wrap;overflow-wrap:anywhere;background:#172638;padding:20px;border-radius:8px}small{color:#b6c6d6}</style>
<small>ORZYON / LABORATÓRIO LOCAL</small><h1>Conhecimento e inferência</h1>
<p>Pesquise o acervo da plataforma ou gere uma resposta com o gateway configurado.</p>
<label for="token">Token de acesso</label><input id="token" type="password" autocomplete="off">
<small>O token permanece somente na memória desta página.</small>
<label for="question">Sua pergunta</label><textarea id="question" rows="4" maxlength="500"></textarea>
<button id="search">Pesquisar documentos</button><button id="ask">Gerar resposta</button>
<pre id="result" aria-live="polite">Pronto para consultar.</pre>
<script>
async function run(generate){const out=document.getElementById('result');out.textContent='Consultando…';
const q=document.getElementById('question').value;if(!q.trim()){out.textContent='Escreva uma pergunta.';return;}
try{const r=await fetch(generate?'/api/v1/agent':'/api/v1/documents?q='+encodeURIComponent(q),{method:generate?'POST':'GET',headers:{'Authorization':'Bearer '+document.getElementById('token').value,'Content-Type':'application/json'},body:generate?JSON.stringify({question:q}):undefined});const data=await r.json();out.textContent=JSON.stringify(data,null,2);}catch{out.textContent='Não foi possível conectar ao serviço.';}}
document.getElementById('search').onclick=()=>run(false);document.getElementById('ask').onclick=()=>run(true);
</script></html>
