apiVersion: v1
kind: Pod
metadata:
  name: scheduling-lab
  namespace: orzyon
  labels: {app: scheduling-lab}
spec:
  restartPolicy: Never
  automountServiceAccountToken: false
  nodeSelector:
    orzyon.ai/lab-capacity: unavailable
  securityContext:
    runAsNonRoot: true
    runAsUser: 10001
    seccompProfile: {type: RuntimeDefault}
  containers:
    - name: sleeper
      image: busybox:1.37.0
      command: [sh, -c, "sleep 3600"]
      resources:
        requests: {cpu: 10m, memory: 16Mi}
        limits: {cpu: 50m, memory: 32Mi}
      securityContext:
        allowPrivilegeEscalation: false
        readOnlyRootFilesystem: true
        capabilities: {drop: [ALL]}
