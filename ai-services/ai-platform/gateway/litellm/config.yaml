model_list:
  - model_name: local-model
    litellm_params:
      model: openai/local-model
      api_base: http://vllm:8000/v1
      api_key: os.environ/VLLM_API_KEY
      timeout: 15
      max_retries: 0
general_settings:
  master_key: os.environ/LITELLM_MASTER_KEY
litellm_settings:
  set_verbose: false
  drop_params: false
  request_timeout: 15
  num_retries: 0
