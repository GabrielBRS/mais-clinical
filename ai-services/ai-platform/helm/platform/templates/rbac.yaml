apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "platform.name" . }}
automountServiceAccountToken: false
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "platform.name" . }}
rules:
  - apiGroups: [apps]
    resources: [deployments]
    verbs: [list]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "platform.name" . }}
subjects:
  - kind: ServiceAccount
    name: {{ include "platform.name" . }}
    namespace: {{ .Release.Namespace }}
roleRef:
  kind: Role
  name: {{ include "platform.name" . }}
  apiGroup: rbac.authorization.k8s.io
