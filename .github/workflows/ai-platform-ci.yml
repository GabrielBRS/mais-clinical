name: AI Platform CI
on:
  pull_request:
    paths: ['ai-services/ai-platform/**', '.github/workflows/ai-platform-ci.yml']
  push:
    paths: ['ai-services/ai-platform/**', '.github/workflows/ai-platform-ci.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ai-platform-${{ github.ref }}
  cancel-in-progress: true
defaults:
  run:
    working-directory: ai-services/ai-platform
jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: python -m pip install uv==0.8.22
      - run: uv sync --frozen
      - run: uv run ruff check . && uv run ruff format --check . && uv run mypy src
      - run: uv run pytest -q
      - run: uv run pip-audit --progress-spinner off
      - name: Helm and Terraform CLIs (official checksums)
        run: |
          mkdir -p /tmp/orzyon-ci-tools
          curl -fsSL https://get.helm.sh/helm-v3.17.3-linux-amd64.tar.gz -o /tmp/orzyon-ci-tools/helm.tar.gz
          curl -fsSL https://get.helm.sh/helm-v3.17.3-linux-amd64.tar.gz.sha256sum -o /tmp/orzyon-ci-tools/helm.sha256
          echo "$(cut -d ' ' -f1 /tmp/orzyon-ci-tools/helm.sha256)  /tmp/orzyon-ci-tools/helm.tar.gz" | sha256sum -c -
          tar xzf /tmp/orzyon-ci-tools/helm.tar.gz -C /tmp/orzyon-ci-tools
          echo /tmp/orzyon-ci-tools/linux-amd64 >> "$GITHUB_PATH"
          curl -fsSL https://releases.hashicorp.com/terraform/1.11.4/terraform_1.11.4_linux_amd64.zip -o /tmp/orzyon-ci-tools/terraform.zip
          curl -fsSL https://releases.hashicorp.com/terraform/1.11.4/terraform_1.11.4_SHA256SUMS -o /tmp/orzyon-ci-tools/terraform.sums
          echo "$(awk '/terraform_1.11.4_linux_amd64.zip$/ {print $1}' /tmp/orzyon-ci-tools/terraform.sums)  /tmp/orzyon-ci-tools/terraform.zip" | sha256sum -c -
          unzip /tmp/orzyon-ci-tools/terraform.zip -d /tmp/orzyon-ci-tools
          echo /tmp/orzyon-ci-tools >> "$GITHUB_PATH"
      - run: helm lint helm/platform && helm template orzyon helm/platform -n orzyon > /tmp/orzyon-manifests.yaml
      - run: uv run python scripts/validate_manifests.py /tmp/orzyon-manifests.yaml
      - run: terraform fmt -check -recursive infrastructure/terraform
      - run: terraform -chdir=infrastructure/terraform/labs/local init -backend=false && terraform -chdir=infrastructure/terraform/labs/local validate
      - name: Container build and actual health
        run: |
          docker build -t orzyon/platform:ci .
          export ORZYON_API_TOKEN="$(openssl rand -hex 32)"
          docker run -d --name orzyon-ci --read-only --tmpfs /tmp --cap-drop ALL --security-opt no-new-privileges -e ORZYON_API_TOKEN -p 127.0.0.1:8000:8000 orzyon/platform:ci
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8000/health/ready; then break; fi
            sleep 1
          done
          curl -fsS http://127.0.0.1:8000/health/ready
          uv run python scripts/mcp_smoke.py
      - name: Container vulnerability scan
        run: docker run --rm -v /var/run/docker.sock:/var/run/docker.sock aquasec/trivy:0.74.0 image --exit-code 1 --severity HIGH,CRITICAL orzyon/platform:ci
      - name: Container logs
        if: failure()
        run: docker logs orzyon-ci || true
